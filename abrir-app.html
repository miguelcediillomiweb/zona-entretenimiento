<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zona Entretenimiento</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#0b0b1a;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .caja{max-width:320px}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{opacity:.8;margin:0 0 20px;font-size:.95rem}
  a{display:block;margin:10px 0;padding:14px;border-radius:12px;text-decoration:none;font-weight:700;color:#fff;background:linear-gradient(90deg,#7b2ff7,#f107a3)}
</style>
</head>
<body>
<div class="caja">
  <h1>🎬 Zona Entretenimiento</h1>
  <p>Abriendo la app… Si no se abre sola, toca el botón. Si no la tienes, te llevo a la web.</p>
  <a id="abrir" href="#">📱 Abrir la app</a>
</div>
<script>
(function () {
  var WEB = "https://miguelcediillomiweb.github.io/zona-entretenimiento/";
  var PKG = "mx.cedillo.zonaentretenimiento";
  var INTENT = "intent://catalogo#Intent;scheme=zonaentretenimiento;package=" + PKG +
               ";S.browser_fallback_url=" + encodeURIComponent(WEB) + ";end";
  var salio = false, t;

  function irWeb() { location.replace(WEB); }
  function marcar() { salio = true; clearTimeout(t); }

  document.addEventListener("visibilitychange", function () { if (document.hidden) marcar(); });
  window.addEventListener("pagehide", marcar);

  document.getElementById("abrir").addEventListener("click", function (e) {
    e.preventDefault();
    clearTimeout(t);
    location.href = INTENT;
    t = setTimeout(function () { if (!salio) irWeb(); }, 3000);
  });

  setTimeout(function () { location.href = INTENT; }, 400);
  t = setTimeout(function () { if (!salio) irWeb(); }, 10000);
})();
</script>
</body>
</html>

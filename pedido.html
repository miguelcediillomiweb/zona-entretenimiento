<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haz tu pedido - Zona de Entretenimiento</title>
<link rel="stylesheet" href="style.css">
</head><body><main>
<section class="banner"><h1>✨ Haz tu pedido</h1><p>Dime qué serie o película quieres</p></section>
<section class="banner2" style="text-align:left">
<label for="tipo">¿Qué buscas?</label>
<select id="tipo"><option>Película</option><option>Serie</option></select>
<label for="titulo">Título</label>
<input id="titulo" placeholder="Ej. Spider-Man 2" maxlength="120">
<label for="nombre">Tu nombre (opcional)</label>
<input id="nombre" maxlength="60">
<label for="nota">Comentario (opcional)</label>
<textarea id="nota" rows="2" maxlength="300"></textarea>
<button class="btn" id="enviar">Enviar pedido</button>
<p class="msg" id="msg"></p>
</section>
<a class="btn alt" href="index.html">🏠 Volver al inicio</a>
</main><footer>Creado por Cedillo ©️</footer>
<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbx7FefyHQXWIiqgnSqXJ31TmrLurHXRkgKwJkEZttrXR9s0iTCCK_9tlrnXw5FYPpVLFQ/exec";
var m=document.getElementById("msg");
document.getElementById("enviar").onclick=function(){
  var titulo=document.getElementById("titulo").value.trim();
  if(!titulo){m.textContent="Escribe el título que buscas 🙂";return}
  m.textContent="Enviando...";
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({
    tipo:document.getElementById("tipo").value,titulo:titulo,
    nombre:document.getElementById("nombre").value.trim(),nota:document.getElementById("nota").value.trim()})})
  .then(function(){m.textContent="¡Pedido enviado! 🎉 Gracias.";document.getElementById("titulo").value="";document.getElementById("nota").value=""})
  .catch(function(){m.textContent="No se pudo enviar. Intenta de nuevo."});
};
</script></body></html>

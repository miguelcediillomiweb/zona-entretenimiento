name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - app-android-separada
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar componentes Android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Compilar APK de prueba
        working-directory: android-app
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: zona-entretenimiento-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# La compatibilidad AndroidX se activa en android-app/gradle.properties.

# Reconstruir con el ajuste final del dominio y los enlaces externos.
